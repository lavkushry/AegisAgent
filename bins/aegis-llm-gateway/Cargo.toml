[package]
name = "aegis-llm-gateway"
version = "0.1.0"
edition = "2021"
description = "AegisAgent LLM gateway adapter (Phase 7.3): OpenAI-compatible reverse proxy that captures model-call metadata (hashes, token counts) and ships lineage events to the control plane — never raw prompts by default."

[[bin]]
name = "aegis-llm-gateway"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
axum = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
async-trait = "0.1.89"
bytes = "1.10"
http = "1.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tokio = { workspace = true }
http-body-util = "0.1"
