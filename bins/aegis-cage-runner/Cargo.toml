[package]
name = "aegis-cage-runner"
version = "0.1.0"
edition = "2021"
description = "AegisAgent disposable sandbox executor for unknown/untrusted agents — a separate binary from the gateway, never the other way around."

[[bin]]
name = "aegis-cage-runner"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }
async-trait = "0.1.89"
crc32fast = "1.4"
clap = { version = "4.6", features = ["derive"] }
toml = "0.8"
url = "2.5"
hex = "0.4"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
hostname = "0.4"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
axum = { workspace = true }
