site_name: AegisAgent Documentation
site_description: The integrity layer for AI agent actions — delivered as an integrity-anchored Agent SOC.
site_author: AegisAgent
site_url: https://lavkushry.github.io/AegisAgent/

repo_url: https://github.com/lavkushry/AegisAgent
repo_name: lavkushry/AegisAgent
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Open, self-hostable, framework-neutral.

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Internal strategy/PM docs stay in the repo but are NOT published to the site.
exclude_docs: |
  README.md
  AegisAgent_Vision.md
  AegisAgent_Gap_Reassessment_2026-06.md
  AegisAgent_PRD.md
