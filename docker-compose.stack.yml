# Full local stack: backend (gateway) + frontend (console) + LLM lineage path.
# Uses bridge networking + published ports (Docker Desktop macOS friendly).
#
#   export AEGIS_API_TOKEN=tenant_docker_e2e
#   docker compose -f docker-compose.stack.yml up --build -d
#   open http://127.0.0.1:8080/dashboard/     # frontend (static console)
#   open http://127.0.0.1:8080/v1/livez       # backend API
#   curl  http://127.0.0.1:8090/v1/chat/completions   # LLM proxy
#
# Frontend is the Next.js static export baked into the gateway image and
# served at /dashboard/* (same origin as the API — no CORS needed).

services:
  init-data-dir:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data && chmod -R 0777 /data"]
    volumes:
      - ./data-e2e:/data

  gateway:
    image: aegisagent-gateway:local
    build:
      context: .
      dockerfile: src/Dockerfile
    depends_on:
      init-data-dir:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AEGIS_BIND_ADDR: "0.0.0.0:8080"
      AEGIS_DEMO_MODE: "true"
      AEGIS_JWT_REQUIRED: "false"
      DATABASE_URL: sqlite:///data/aegis.db
      CEDAR_POLICY_PATH: /app/policies.cedar
      RUST_LOG: info,gateway=info,sqlx=warn
    volumes:
      - ./data-e2e:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/aegis-gateway", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Creates demo tenants the console expects (Settings / default bearer).
  seed:
    image: curlimages/curl:8.12.1
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for id in tenant_docker_e2e tenant_123 tenant_dev_alpha; do
          curl -sf -X POST http://gateway:8080/v1/tenants \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$$id\",\"name\":\"$$id\",\"plan\":\"free\"}" \
            && echo " created $$id" \
            || echo " $$id already exists or create skipped"
        done
        echo "seed complete"
        curl -sf http://gateway:8080/v1/stats -H "Authorization: Bearer tenant_docker_e2e" || true

  mock-openai:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import json
        class H(BaseHTTPRequestHandler):
            def log_message(self, *a): pass
            def do_POST(self):
                n = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(n)
                try:
                    req = json.loads(body or b"{}")
                except Exception:
                    req = {}
                model = req.get("model", "gpt-4o-mini")
                data = json.dumps({
                    "id": "chatcmpl-docker-e2e",
                    "object": "chat.completion",
                    "model": model,
                    "choices": [{"index": 0, "message": {"role": "assistant", "content": "docker-e2e-ok"}, "finish_reason": "stop"}],
                    "usage": {"prompt_tokens": 9, "completion_tokens": 4, "total_tokens": 13},
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
        HTTPServer(("0.0.0.0", 18090), H).serve_forever()
    expose:
      - "18090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18090/v1/chat/completions', data=b'{}', method='POST'))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  llm-gateway:
    image: aegisagent-llm-gateway:local
    build:
      context: .
      dockerfile: bins/aegis-llm-gateway/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      RUST_LOG: info
      AEGIS_API_TOKEN: ${AEGIS_API_TOKEN:-tenant_docker_e2e}
    command:
      - "--listen"
      - "0.0.0.0:8090"
      - "--upstream"
      - "http://mock-openai:18090"
      - "--provider"
      - "openai"
      - "--gateway-url"
      - "http://gateway:8080"
      - "--api-token"
      - "${AEGIS_API_TOKEN:-tenant_docker_e2e}"
      - "--run-id"
      - "run-docker-e2e"
      - "--trace-id"
      - "trace-docker-e2e"
      - "--source-trust"
      - "trusted_internal_unsigned"
