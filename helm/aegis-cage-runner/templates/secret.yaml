{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-cage-runner.fullname" . }}
  labels:
    {{- include "aegis-cage-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.apiToken }}
  AEGIS_API_TOKEN: {{ .Values.secret.apiToken | quote }}
  {{- end }}
{{- end }}
