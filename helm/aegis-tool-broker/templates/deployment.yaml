apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-tool-broker.fullname" . }}
  labels:
    {{- include "aegis-tool-broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis-tool-broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aegis-tool-broker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aegis-tool-broker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tool-broker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--listen"
            - "0.0.0.0:{{ .Values.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: AEGIS_TOOL_BROKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegis-tool-broker.secretName" . }}
                  key: AEGIS_TOOL_BROKER_API_TOKEN
                  optional: true
            {{- if .Values.config.githubApiBase }}
            - name: AEGIS_GITHUB_API_BASE
              value: {{ .Values.config.githubApiBase | quote }}
            {{- end }}
            {{- if .Values.config.brokerWorkspace }}
            - name: AEGIS_BROKER_WORKSPACE
              value: {{ .Values.config.brokerWorkspace | quote }}
            {{- end }}
          # Unlike aegis-egress-proxy/aegis-llm-gateway's tcpSocket probes,
          # this binary is a real HTTP JSON API (not a CONNECT proxy) — a
          # path-level probe against the actual health routes is strictly
          # more correct and no more complex to write.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
