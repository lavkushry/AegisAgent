{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis-tool-broker.fullname" . }}
  labels:
    {{- include "aegis-tool-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.apiToken }}
  AEGIS_TOOL_BROKER_API_TOKEN: {{ .Values.secret.apiToken | quote }}
  {{- end }}
{{- end }}
