apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis-llm-gateway.fullname" . }}
  labels:
    {{- include "aegis-llm-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegis-llm-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "aegis-llm-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aegis-llm-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llm-gateway
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--listen"
            - "0.0.0.0:{{ .Values.service.port }}"
            - "--upstream"
            - {{ .Values.config.upstream | quote }}
            - "--provider"
            - {{ .Values.config.provider | quote }}
            {{- if .Values.config.gatewayUrl }}
            - "--gateway-url"
            - {{ .Values.config.gatewayUrl | quote }}
            {{- end }}
            {{- if .Values.config.runId }}
            - "--run-id"
            - {{ .Values.config.runId | quote }}
            {{- end }}
            {{- if .Values.config.traceId }}
            - "--trace-id"
            - {{ .Values.config.traceId | quote }}
            {{- end }}
            {{- if .Values.config.sourceTrust }}
            - "--source-trust"
            - {{ .Values.config.sourceTrust | quote }}
            {{- end }}
            {{- if not .Values.config.capturePrompts }}
            - "--no-capture-prompts"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: AEGIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegis-llm-gateway.secretName" . }}
                  key: AEGIS_API_TOKEN
                  optional: true
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
