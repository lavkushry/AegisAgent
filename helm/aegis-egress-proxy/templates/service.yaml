apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis-egress-proxy.fullname" . }}
  labels:
    {{- include "aegis-egress-proxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: proxy
      port: {{ .Values.service.port }}
      targetPort: proxy
      protocol: TCP
  selector:
    {{- include "aegis-egress-proxy.selectorLabels" . | nindent 4 }}
