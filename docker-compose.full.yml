# #1297: local full-stack compose — everything docker-compose.yml starts
# (gateway, seeded on demand via docker-compose.dev.yml) plus the runtime
# data-plane components that ship as separate binaries/images
# (aegis-egress-proxy, aegis-node-sensor, optional aegis-cage-runner) and
# Qdrant, the external vector store lib/soc/src/qdrant.rs talks to. Kept as
# a separate file rather than folded into docker-compose.yml so the base
# file (what CI's Docker Compose E2E job runs) is untouched.
#
# Cage runner (profile `cage`): binary + image exist (`bins/aegis-cage-runner`).
# Start with:
#   export AEGIS_COMMAND_SIGNING_KEY=<32-byte seed hex>
#   export AEGIS_CAGE_GATEWAY_PUBLIC_KEY_HEX=<matching verifying key hex>
#   export AEGIS_SENSOR_API_TOKEN=tenant_dev_alpha   # same bearer pattern
#   docker compose -f docker-compose.full.yml --profile cage up --build -d
# Gateway must receive AEGIS_COMMAND_SIGNING_KEY (override gateway.environment
# or export before `up`) so create-run issues verifiable start_run commands.
#
# Prerequisite: aegis-node-sensor authenticates like any other API client
# (bearer token, no sensor-specific auth mechanism — see
# bins/aegis-node-sensor/src/gateway_client.rs) and refuses to start
# without one (config.rs's SensorConfig::resolve fails closed on a missing
# api_token). Create the tenant, then export AEGIS_SENSOR_API_TOKEN before
# `up`, e.g. against a running `docker compose up -d gateway`:
#   curl -X POST http://127.0.0.1:8080/v1/tenants \
#     -H "Content-Type: application/json" \
#     -d '{"id":"tenant_dev_alpha","name":"Dev Tenant Alpha","plan":"free"}'
#   export AEGIS_SENSOR_API_TOKEN=tenant_dev_alpha
# In this local/dev setup (no AEGIS_JWT_REQUIRED) the gateway's TenantId
# extractor accepts any `tenant_`-prefixed bearer as that tenant, so the
# tenant id itself is the token — verified end-to-end locally (sensor
# registered, heartbeat succeeded). A production deployment with JWT
# required would instead issue this token via a real registered
# agent/service-account credential, not the tenant id.
#
# Also verified locally: `network_mode: host` (used here and in the base
# docker-compose.yml) needs Docker Desktop's host-networking support on
# macOS/Windows, which is not on by default (check Docker Desktop's
# networking settings for a host-networking toggle; availability/wording
# varies by version). If `curl 127.0.0.1:8080` hangs against a container
# reporting "healthy", that's this — the HEALTHCHECK directive execs
# inside the container's own namespace and passes regardless of host
# reachability. Linux (incl. CI) is unaffected — host networking there
# just works. To smoke-test on an affected host, temporarily swap
# `network_mode: host` for an explicit `ports:` mapping on a bridge
# network instead.
include:
  - docker-compose.yml

services:
  # Phase 1 tool-broker extraction: wires the gateway's POST
  # /v1/broker/execute at the standalone binary below rather than 501ing
  # (no in-process fallback exists any more). AEGIS_TOOL_BROKER_API_TOKEN
  # must match the tool-broker service's own token below.
  gateway:
    environment:
      AEGIS_TOOL_BROKER_URL: http://127.0.0.1:8899
      AEGIS_TOOL_BROKER_API_TOKEN: ${AEGIS_TOOL_BROKER_API_TOKEN:-}

  qdrant:
    image: qdrant/qdrant:v1.13.2
    network_mode: host
    volumes:
      - ./data/qdrant:/qdrant/storage

  egress-proxy:
    build:
      context: .
      dockerfile: bins/aegis-egress-proxy/Dockerfile
    image: aegisagent-egress-proxy:local
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RUST_LOG: info
    command:
      - "--listen"
      - "127.0.0.1:8888"
      - "--gateway-url"
      - "http://127.0.0.1:8080"

  node-sensor:
    build:
      context: .
      dockerfile: bins/aegis-node-sensor/Dockerfile
    image: aegisagent-node-sensor:local
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RUST_LOG: info
    volumes:
      - ./data/sensor:/var/lib/aegis-sensor
    command:
      - "--gateway-url"
      - "http://127.0.0.1:8080"
      - "--tenant-id"
      - "${AEGIS_DEMO_TENANT_ID:-tenant_dev_alpha}"
      - "--api-token"
      - "${AEGIS_SENSOR_API_TOKEN:?Register an agent for the sensor and export its token as AEGIS_SENSOR_API_TOKEN first -- see the prerequisite note above}"
      - "--mode"
      - "observe"

  # Phase 4 cage executor — claims `/v1/agent-cage/runs` and runs Docker sandboxes.
  # Opt-in profile so CI / default full stack stay free of docker.sock mounts.
  cage-runner:
    profiles: ["cage"]
    build:
      context: .
      dockerfile: bins/aegis-cage-runner/Dockerfile
    image: aegisagent-cage-runner:local
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RUST_LOG: info
    volumes:
      # Host Docker engine — required for SandboxRuntime (create/start/kill).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/cage-workspaces:/var/lib/aegis-cage/workspaces
    command:
      - "--gateway-url"
      - "http://127.0.0.1:8080"
      - "--tenant-id"
      - "${AEGIS_DEMO_TENANT_ID:-tenant_dev_alpha}"
      - "--api-token"
      - "${AEGIS_CAGE_API_TOKEN:-${AEGIS_SENSOR_API_TOKEN:?Export AEGIS_CAGE_API_TOKEN or AEGIS_SENSOR_API_TOKEN (tenant bearer)}}"
      - "--gateway-public-key-hex"
      - "${AEGIS_CAGE_GATEWAY_PUBLIC_KEY_HEX:?Export the Ed25519 public key matching gateway AEGIS_COMMAND_SIGNING_KEY}"
      - "--runner-id"
      - "${AEGIS_CAGE_RUNNER_ID:-cage-runner-local}"

  # Phase 7.3 LLM gateway adapter — OpenAI-compatible reverse proxy.
  # Point agent SDK base URLs at 127.0.0.1:8090 instead of the provider.
  # Set AEGIS_LLM_UPSTREAM / AEGIS_API_TOKEN as needed.
  llm-gateway:
    build:
      context: .
      dockerfile: bins/aegis-llm-gateway/Dockerfile
    image: aegisagent-llm-gateway:local
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      RUST_LOG: info
      AEGIS_API_TOKEN: ${AEGIS_API_TOKEN:-}
    command:
      - "--listen"
      - "127.0.0.1:8090"
      - "--upstream"
      - "${AEGIS_LLM_UPSTREAM:-https://api.openai.com}"
      - "--provider"
      - "${AEGIS_LLM_PROVIDER:-openai}"
      - "--gateway-url"
      - "http://127.0.0.1:8080"

  # Phase 1 tool-broker extraction — standalone connector-execution engine.
  # The gateway no longer links aegis-tool-broker-connectors at all; without
  # this service (or an equivalent AEGIS_TOOL_BROKER_URL), POST
  # /v1/broker/execute 501s. AEGIS_TOOL_BROKER_API_TOKEN is a shared secret
  # between this service and the gateway above -- distinct from the
  # gateway's own AEGIS_API_TOKEN.
  tool-broker:
    build:
      context: .
      dockerfile: bins/aegis-tool-broker/Dockerfile
    image: aegisagent-tool-broker:local
    network_mode: host
    environment:
      RUST_LOG: info
      AEGIS_TOOL_BROKER_API_TOKEN: ${AEGIS_TOOL_BROKER_API_TOKEN:?Export a shared secret for gateway<->tool-broker calls}
    command:
      - "--listen"
      - "127.0.0.1:8899"

